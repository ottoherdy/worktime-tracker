name: Release

# Publishes a GitHub Release whenever the version in manifest.json changes on
# main. HACS reads releases, so this is what tells existing users an update is
# available — and the CHANGELOG section becomes the notes they see.
#
# To ship a release: bump "version" in manifest.json, add the matching
# "## [x.y.z]" section to CHANGELOG.md, and merge to main. Nothing else.

on:
  push:
    branches: [main]
    paths:
      - custom_components/worktime_tracker/manifest.json

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version from manifest
        id: version
        shell: bash
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/worktime_tracker/manifest.json'))['version'])")
          if [ -z "$version" ]; then
            echo "manifest.json has no version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $version"

      - name: Skip if the tag already exists
        id: check
        shell: bash
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists — nothing to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG
        if: steps.check.outputs.exists == 'false'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Written to a file, never to a step output or a shell argument.
          # Release notes contain backticks, quotes and $ — interpolating them
          # into a command line would both mangle the text and let CHANGELOG
          # content execute as shell.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ] || ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::warning::No '## [$VERSION]' section in CHANGELOG.md — releasing without notes."
            echo "See the commit history for what changed in this release." > release-notes.md
          fi

          echo "--- release notes ---"
          cat release-notes.md

      - name: Create tag and release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md
