name: Release

# Publishes a GitHub Release whenever the version in manifest.json changes on
# main. HACS reads releases, so this is what tells existing users an update is
# available — and the CHANGELOG section becomes the notes they see.
#
# To ship a release: bump "version" in manifest.json, add the matching
# "## [x.y.z]" section to CHANGELOG.md, and merge to main. Nothing else.

on:
  push:
    branches: [main]
    paths:
      - custom_components/worktime_tracker/manifest.json

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version from manifest
        id: version
        shell: bash
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/worktime_tracker/manifest.json'))['version'])")
          if [ -z "$version" ]; then
            echo "manifest.json has no version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $version"

      - name: Skip if the tag already exists
        id: check
        shell: bash
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists — nothing to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG
        if: steps.check.outputs.exists == 'false'
        id: notes
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          # Pull the lines between "## [version]" and the next "## " heading.
          notes=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md)

          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            echo "::warning::No '## [$version]' section in CHANGELOG.md — releasing without notes."
            notes="See the commit history for what changed in this release."
          fi

          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$notes"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "${{ steps.notes.outputs.body }}"
