name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration

  python:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile-check
        run: |
          python -m compileall -q custom_components/worktime_tracker

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Syntax-check the card, widget and Apps Script
        shell: bash
        run: |
          # node --check refuses unknown extensions, so .gs files are copied to
          # a .js name before checking. Contents are plain JavaScript either way.
          status=0
          tmp=$(mktemp -d)
          while IFS= read -r f; do
            target="$tmp/$(basename "$f").js"
            cp "$f" "$target"
            if node --check "$target"; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              status=1
            fi
          done < <(git ls-files '*.js' '*.gs')
          exit $status
