name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration

  python:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile-check
        run: |
          python -m compileall -q custom_components/worktime_tracker

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Syntax-check the card, widget and Apps Script
        shell: bash
        run: |
          # node --check refuses unknown extensions, so .gs files are copied to
          # a .js name before checking. Contents are plain JavaScript either way.
          status=0
          tmp=$(mktemp -d)
          while IFS= read -r f; do
            target="$tmp/$(basename "$f").js"
            cp "$f" "$target"
            if node --check "$target"; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              status=1
            fi
          done < <(git ls-files '*.js' '*.gs')
          exit $status

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    # Only meaningful for pushes and PRs — a scheduled run has no new commits.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check Conventional Commits format
        shell: bash
        run: |
          # Work out which commits are new. History predating this check is
          # never re-examined — only what this push or PR actually adds.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # New branch: compare against main rather than the whole history.
            git fetch origin main --depth=100 || true
            range="origin/main..${{ github.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi

          echo "Checking range: $range"
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9,._/-]+\))?!?: .+'

          status=0
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            subject=$(git log -1 --format=%s "$sha")
            # Merge commits are generated by GitHub and exempt.
            if [ "$(git rev-list --parents -n1 "$sha" | wc -w)" -gt 2 ]; then
              echo "skip $(git rev-parse --short "$sha")  (merge) $subject"
              continue
            fi
            if [[ "$subject" =~ $pattern ]]; then
              echo "ok   $(git rev-parse --short "$sha")  $subject"
            else
              echo "FAIL $(git rev-parse --short "$sha")  $subject"
              status=1
            fi
          done < <(git rev-list "$range" 2>/dev/null || true)

          if [ "$status" -ne 0 ]; then
            cat >&2 <<'MSG'

          Commit subjects must follow Conventional Commits:

            <type>[optional scope][!]: <description>

          Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert
          Examples:
            feat(card): add a month summary section
            fix: stop zone flutter from logging an early departure
            docs: explain the multi-instance entity prefix

          See CONTRIBUTING.md. Reword with: git commit --amend
          MSG
          fi
          exit $status
